<style>
/* Layout: first OpenHelix UI. Left rail of sections (bottom bar on phones), sticky top status bar, bevel-cornered panels on a deep void ground */
:root{
  --void:#07050f; --void-2:#0c0919; --panel:#110d22; --panel-2:#171130; --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.15);
  --crimson:#e6103a; --crimson-2:#ff2f5c; --crimson-soft:rgba(230,16,58,.14); --violet:#8a4bff;
  --ok:#2bd47a; --ok-soft:rgba(43,212,122,.1); --warn:#ffb020; --warn-soft:rgba(255,176,32,.1); --bad:#ff4d6a; --bad-soft:rgba(255,77,106,.1);
  --ink:#f4eef3; --ink-2:#b8adc6; --ink-3:#7f7594;
  --f-display:'Chakra Petch',system-ui,sans-serif; --f-body:'Sora',system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --bevel:14px; --rail:236px;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--void);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--void-2)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--crimson-2);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;line-height:1.15;letter-spacing:-.005em;text-wrap:balance}
h1{font-size:clamp(24px,3vw,32px)}
h2{font-size:17px}
h3{font-size:15px}
.mono{font-family:var(--f-mono);font-size:.92em;font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
:focus-visible{outline:2px solid var(--crimson-2);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* shell */
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:19px;padding:4px 8px 22px;color:var(--ink);text-decoration:none!important}
.brand b{color:var(--crimson-2)}
.brand svg{width:28px;height:28px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav-label{font-family:var(--f-display);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;color:var(--ink-2);font-size:13.5px;border:1px solid transparent;text-decoration:none!important;transition:.2s}
.nav a svg{width:18px;height:18px;flex:none}
.nav a:hover{color:var(--ink);background:rgba(255,255,255,.03)}
.nav a.on{color:#fff;background:var(--crimson-soft);border-color:rgba(230,16,58,.35)}
.nav a.on svg{color:var(--crimson-2)}
.rail-foot{margin-top:auto;border:1px solid var(--line);padding:14px;font-size:12px;color:var(--ink-3)}
.rail-foot b{display:block;color:var(--ink-2);font-family:var(--f-display);font-size:13px;margin-bottom:4px}
.main{min-width:0;display:flex;flex-direction:column}
.banner{display:flex;gap:10px;align-items:center;padding:9px max(24px,env(safe-area-inset-right,0px)) 9px 24px;background:linear-gradient(90deg,rgba(255,176,32,.12),transparent);border-bottom:1px solid rgba(255,176,32,.2);font-size:12.5px;color:#f2d9a8}
.banner .pip{width:7px;height:7px;background:var(--warn);transform:rotate(45deg);flex:none}
.chip{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border:1px solid var(--line-2);background:var(--panel);font-size:13px;color:var(--ink-2);white-space:nowrap}
.chip .d{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.chip.warn{color:var(--warn);border-color:rgba(255,176,32,.4)}
.chip.warn .d{background:var(--warn);box-shadow:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border:1px solid var(--line-2);background:transparent;color:var(--ink);font-family:var(--f-display);font-weight:600;font-size:13.5px;letter-spacing:.02em;cursor:pointer;white-space:nowrap;text-decoration:none!important;transition:.2s}
.btn:hover{border-color:var(--crimson);background:rgba(230,16,58,.08)}
.btn.primary{background:var(--crimson);border-color:var(--crimson);color:#fff;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);box-shadow:0 8px 26px rgba(230,16,58,.3)}
.btn.primary:hover{background:var(--crimson-2)}
.btn.danger{color:var(--bad);border-color:rgba(255,77,106,.4)}
.btn.lg{height:46px;font-size:15px;width:100%}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{border-color:transparent}
.linkbtn{background:none;border:none;color:var(--crimson-2);cursor:pointer;font-size:13px;font-family:var(--f-display);font-weight:600}

/* page */
.page{max-width:1240px;width:100%;padding:28px max(24px,env(safe-area-inset-right,0px)) 56px 24px;display:flex;flex-direction:column;gap:22px;animation:rise .45s cubic-bezier(.16,1,.3,1)}
@keyframes rise{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.phead h1::before{content:"";display:block;width:22px;height:2px;background:var(--crimson);margin-bottom:12px}
.phead p{color:var(--ink-2);margin-top:8px;max-width:64ch}
.card{background:var(--panel);border:1px solid var(--line);min-width:0;position:relative}
.split>.card,.sticky>.card:first-child{clip-path:polygon(var(--bevel) 0,100% 0,100% calc(100% - var(--bevel)),calc(100% - var(--bevel)) 100%,0 100%,0 var(--bevel))}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h2{font-size:15px}
.card-h p{color:var(--ink-3);font-size:12.5px}
.card-b{padding:20px;display:flex;flex-direction:column;gap:16px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:20px;align-items:start}
.sticky{position:sticky;top:84px;display:flex;flex-direction:column;gap:16px}
.sticky .sum{background:linear-gradient(155deg,rgba(230,16,58,.18),rgba(138,75,255,.06) 60%,var(--panel));border-color:rgba(255,47,92,.3)}

/* form */
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field label{font-family:var(--f-display);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.field .hint{font-size:12px;color:var(--ink-3)}
.field .err{font-size:12px;color:var(--bad)}
.inp{height:42px;width:100%;padding:0 13px;border:1px solid var(--line-2);background:var(--void-2);min-width:0;transition:.2s}
.inp:focus{outline:none;border-color:var(--crimson);box-shadow:0 0 0 3px rgba(230,16,58,.15)}
.inp.bad{border-color:var(--bad)}
select.inp{appearance:none;padding-right:32px;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 17px) 52%,calc(100% - 12px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.row-3-1{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1fr);gap:14px}
.nets{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.net{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line-2);background:var(--void-2);cursor:pointer;text-align:left;transition:.2s}
.net:hover{border-color:rgba(230,16,58,.5)}
.net.on{border-color:var(--crimson);background:var(--crimson-soft)}
.net b{font-weight:500}
.net .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:10px;font-weight:700;color:#fff;flex:none}
.net small{display:block;color:var(--ink-3);font-size:11.5px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);background:var(--void-2);cursor:pointer}
.opt input{margin-top:3px;width:16px;height:16px;accent-color:var(--crimson);flex:none}
.opt b{font-weight:500;display:block}
.opt span{color:var(--ink-2);font-size:13px}

/* summary */
.sum dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 16px;font-size:13.5px}
.sum dt{color:var(--ink-3)}
.sum dd{text-align:right;word-break:break-word}
.sum hr{border:none;border-top:1px solid var(--line);grid-column:1/-1}
.note{display:flex;gap:10px;padding:12px 14px;font-size:13px;line-height:1.45;border:1px solid var(--line)}
.note svg{width:16px;height:16px;flex:none;margin-top:1px}
.note.warn{background:var(--warn-soft);color:#f2d9a8;border-color:rgba(255,176,32,.25)}
.note.warn svg{color:var(--warn)}
.note.info{background:rgba(255,255,255,.02);color:var(--ink-2)}
.note.ok{background:var(--ok-soft);color:#c9f5dc;border-color:rgba(43,212,122,.3)}
.note.ok svg{color:var(--ok)}
.note.bad{background:var(--bad-soft);color:#ffc9d2;border-color:rgba(255,77,106,.3)}
.note b{font-weight:600}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:600px;font-size:13px}
th{text-align:left;font-family:var(--f-display);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:12px 20px;border-bottom:1px solid var(--line)}
td{padding:14px 20px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--panel-2)}
tr:last-child td{border-bottom:none}
.r{text-align:right}
.tk{display:flex;align-items:center;gap:10px}
.av{width:32px;height:32px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:11px;background:var(--void-2);border:1px solid var(--line-2);color:var(--crimson-2);flex:none;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.tk b{font-weight:500;display:block}
.tk small{color:var(--ink-3)}
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border:1px solid var(--line-2);font-family:var(--f-display);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;transform:rotate(45deg);background:currentColor}
.badge.ok{color:var(--ok);border-color:rgba(43,212,122,.35)}
.badge.warn{color:var(--warn);border-color:rgba(255,176,32,.35)}
.badge.acc{color:var(--crimson-2);border-color:rgba(255,47,92,.4)}
.empty{padding:44px 20px;text-align:center;color:var(--ink-3)}
.empty h3{color:var(--ink-2);margin-bottom:4px}

/* detail */
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line)}
.kv div{background:var(--panel);padding:14px 20px;min-width:0}
.kv span{display:block;font-family:var(--f-display);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.kv b{font-weight:500;word-break:break-all}
.addr{display:flex;align-items:center;gap:8px;min-width:0;background:var(--void-2);border:1px solid var(--line-2);padding:8px 10px}
.addr code{font-family:var(--f-mono);font-size:12.5px;word-break:break-all;flex:1}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.act{border:1px solid var(--line);background:var(--void-2);padding:16px;display:flex;flex-direction:column;gap:10px}
.act p{color:var(--ink-2);font-size:13px}
.act .line{display:flex;gap:8px}
.act .line .inp{flex:1}

/* liquidity steps */
.steps{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:34px minmax(0,1fr);gap:14px;padding:18px 20px;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:none}
.step .n{width:30px;height:30px;border:1px solid rgba(255,47,92,.5);background:var(--crimson-soft);color:var(--crimson-2);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:13px;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.step p{color:var(--ink-2);font-size:13px;margin:4px 0 12px}
.links{display:flex;flex-wrap:wrap;gap:8px}

/* roadmap */
.rm{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.rm-col ul{list-style:none;display:flex;flex-direction:column}
.rm-col li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;padding:14px 20px;border-bottom:1px solid var(--line)}
.rm-col li:last-child{border-bottom:none}
.rm-col li i{width:10px;height:10px;margin-top:5px;border:2px solid var(--ink-3);transform:rotate(45deg)}
.rm-col.now li i{background:var(--ok);border-color:var(--ok)}
.rm-col.next li i{background:var(--crimson-2);border-color:var(--crimson-2);box-shadow:0 0 10px rgba(255,47,92,.6)}
.rm-col li b{font-weight:500;display:block}
.rm-col li span{color:var(--ink-2);font-size:13px}

/* faq */
details{border-bottom:1px solid var(--line)}
details:last-child{border-bottom:none}
summary{padding:16px 20px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:15px;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--crimson-2);font-size:20px;line-height:1;transition:.2s}
details[open] summary::after{transform:rotate(45deg)}
details[open]{background:var(--panel-2)}
details .a{padding:0 20px 18px;color:var(--ink-2);max-width:72ch;display:flex;flex-direction:column;gap:10px}
pre{background:var(--void);border:1px solid var(--line);padding:14px;overflow-x:auto;font-family:var(--f-mono);font-size:12px;line-height:1.55;color:var(--ink);max-height:420px}

/* modal / toast */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(4,2,10,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.modal{width:min(470px,100%);background:var(--panel);border:1px solid var(--line-2);max-height:90vh;overflow:auto;clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px)}
.modal .mh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal .mb{padding:20px;display:flex;flex-direction:column;gap:14px}
.wl{display:flex;flex-direction:column;gap:10px}
.wl button{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line-2);background:var(--void-2);cursor:pointer;text-align:left;transition:.2s}
.wl button:hover{border-color:var(--crimson)}
.wl img{width:28px;height:28px}
.prog{display:flex;flex-direction:column}
.prog li{list-style:none;display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line);color:var(--ink-3)}
.prog li .s{width:14px;height:14px;border:1px solid var(--line-2);transform:rotate(45deg);margin-top:4px}
.prog li.run{color:var(--ink)}
.prog li.run .s{border-color:var(--crimson-2);animation:sp 1s linear infinite}
.prog li.done{color:var(--ink-2)}
.prog li.done .s{background:var(--ok);border-color:var(--ok)}
.prog li.fail .s{background:var(--bad);border-color:var(--bad)}
.prog li small{display:block;font-size:12px;word-break:break-all}
@keyframes sp{to{transform:rotate(405deg)}}
.toasts{position:fixed;z-index:60;bottom:max(20px,env(safe-area-inset-bottom,0px));right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--panel-2);border:1px solid var(--line-2);border-left:3px solid var(--ok);padding:12px 16px;font-size:13px;max-width:340px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.toast.err{border-left-color:var(--bad)}

/* footer */
.foot{border-top:1px solid var(--line);margin-top:auto}
.foot-in{padding:22px max(24px,env(safe-area-inset-right,0px)) 26px 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.foot p{color:var(--ink-3);font-size:12.5px}
.soc{display:flex;flex-wrap:wrap;gap:8px}
.soc a{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border:1px solid var(--line);color:var(--ink-2);font-size:13px;text-decoration:none}
.soc a:hover{color:#fff;border-color:var(--crimson);background:rgba(230,16,58,.08)}
.soc svg{width:15px;height:15px}

/* bottom nav (phones) */
@media (max-width:1080px){
  .split{grid-template-columns:minmax(0,1fr)}
  .sticky{position:static}
  .kv{grid-template-columns:repeat(2,minmax(0,1fr))}
  .actions{grid-template-columns:minmax(0,1fr)}
  .rm{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .row2,.row-3-1,.kv{grid-template-columns:minmax(0,1fr)}
  .card-h,.card-b,td,th,.kv div,summary,details .a{padding-left:16px;padding-right:16px}
  .banner span.long{display:none}
}

.bg-fx::after{content:"";position:absolute;bottom:-25%;left:-15%;width:760px;height:760px;background:radial-gradient(circle,rgba(123,43,255,.28),transparent 60%);filter:blur(30px)}

.shell{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(8,5,18,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.site-nav{display:flex;align-items:center;justify-content:space-between;gap:20px;height:74px;max-width:1240px;margin:0 auto;padding-left:max(26px,env(safe-area-inset-left,0px));padding-right:max(26px,env(safe-area-inset-right,0px))}

.subtabs a svg{width:16px;height:16px}
.subtabs a:hover{color:var(--ink);border-color:var(--line-2)}
.subtabs a.on{color:#fff;border-color:var(--crimson);background:var(--crimson-soft)}
.subtabs a.on svg{color:var(--crimson-2)}
.page{margin:0 auto;padding-left:max(26px,env(safe-area-inset-left,0px));padding-right:max(26px,env(safe-area-inset-right,0px))}
.sticky{top:150px}

const SOURCE="// SPDX-License-Identifier: MIT\npragma solidity 0.8.24;\n\nimport {ERC20} from \"@openzeppelin/contracts/token/ERC20/ERC20.sol\";\n\n/// @title OpenHelix standard token\n/// @notice Fixed-supply ERC-20 with optional owner minting and optional holder burning.\n///         Settings are chosen at deploy time and cannot be changed afterwards.\n///         Renouncing ownership permanently disables minting.\ncontract OpenHelixToken is ERC20 {\n    uint8 private _tokenDecimals;\n    bool public mintable;\n    bool public burnable;\n    address public owner;\n\n    event OwnershipTransferred(address indexed previousOwner, address indexed newOwner);\n\n    error NotOwner();\n    error MintingDisabled();\n    error BurningDisabled();\n    error ZeroAddress();\n\n    modifier onlyOwner() {\n        if (msg.sender != owner) revert NotOwner();\n        _;\n    }\n\n    constructor(\n        string memory name_,\n        string memory symbol_,\n        uint8 decimals_,\n        uint256 initialSupply,\n        address recipient,\n        bool mintable_,\n        bool burnable_\n    ) ERC20(name_, symbol_) {\n        if (recipient == address(0)) revert ZeroAddress();\n        _tokenDecimals = decimals_;\n        mintable = mintable_;\n        burnable = burnable_;\n        if (mintable_) {\n            owner = recipient;\n            emit OwnershipTransferred(address(0), recipient);\n        }\n        _mint(recipient, initialSupply);\n    }\n\n    function decimals() public view override returns (uint8) {\n        return _tokenDecimals;\n    }\n\n    function mint(address to, uint256 amount) external onlyOwner {\n        if (!mintable) revert MintingDisabled();\n        _mint(to, amount);\n    }\n\n    function burn(uint256 amount) external {\n        if (!burnable) revert BurningDisabled();\n        _burn(msg.sender, amount);\n    }\n\n    function burnFrom(address account, uint256 amount) external {\n        if (!burnable) revert BurningDisabled();\n        _spendAllowance(account, msg.sender, amount);\n        _burn(account, amount);\n    }\n\n    function transferOwnership(address newOwner) external onlyOwner {\n        if (newOwner == address(0)) revert ZeroAddress();\n        emit OwnershipTransferred(owner, newOwner);\n        owner = newOwner;\n    }\n\n    function renounceOwnership() external onlyOwner {\n        emit OwnershipTransferred(owner, address(0));\n        owner = address(0);\n    }\n}\n";

function bp(){return new ethers.BrowserProvider(W.eth,'any')}
function bindEvents(eth){
 if(!eth.on)return;
 eth.on('accountsChanged',a=>{W.addr=a&&a[0]?ethers.getAddress(a[0]):null;if(!W.addr){W.eth=null}renderBar();render()});
 eth.on('chainChanged',c=>{W.chain=parseInt(c,16);renderBar();render()});
}
async function connectWith(p){
 try{
  const acc=await p.provider.request({method:'eth_requestAccounts'});
  W.eth=p.provider;W.info=p.info;W.addr=ethers.getAddress(acc[0]);W.chain=parseInt(await W.eth.request({method:'eth_chainId'}),16);
  bindEvents(W.eth);closeModal();renderBar();render();toast('Connected '+short(W.addr));
 }catch(e){toast(errMsg(e),1)}
}
function connect(){
 const list=providers.slice();
 if(!list.length&&window.ethereum)list.push({info:{name:window.ethereum.isMetaMask?'MetaMask':'Browser wallet',icon:'',uuid:'legacy'},provider:window.ethereum});
 if(!list.length){
  modal('Connect a wallet',`${note('warn','<b>No wallet found in this browser view.</b> Install MetaMask, Rabby, Trust Wallet or Coinbase Wallet, then reload. On a phone, open your OpenHelix site inside your wallet app\'s built-in browser.')}
   <p class="muted" style="font-size:13px">Wallet extensions cannot reach pages shown inside a preview frame. If you are viewing this inside Claude, open the hosted version of the site instead.</p>`);
  return;
 }
 if(list.length===1)return connectWith(list[0]);
 modal('Connect a wallet',`<div class="wl">${list.map((p,i)=>`<button data-p="${i}">${p.info.icon?`<img src="${esc(p.info.icon)}" alt="">`:'<span class="av">W</span>'}<span><b>${esc(p.info.name)}</b></span></button>`).join('')}</div><p class="faint" style="font-size:12.5px">OpenHelix never asks for your seed phrase or private key.</p>`,m=>{
  m.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>connectWith(list[+b.dataset.p]));
 });

async function ensureChain(id){
 const cur=parseInt(await W.eth.request({method:'eth_chainId'}),16);if(cur===id)return;
 const hex='0x'+id.toString(16),n=net(id);
 try{await W.eth.request({method:'wallet_switchEthereumChain',params:[{chainId:hex}]})}
 catch(e){
  const code=e.code??e?.data?.originalError?.code;
  if(code===4902||/unrecognized|not been added|unknown chain/i.test(e.message||'')){
   await W.eth.request({method:'wallet_addEthereumChain',params:[{chainId:hex,chainName:n.name,nativeCurrency:{name:n.sym,symbol:n.sym,decimals:18},rpcUrls:[n.rpc],blockExplorerUrls:[n.exp]}]});
  }else throw e;
 }
 W.chain=id;
}

function validate(){

let feeSeq=0,feeTimer;
async function estimateFee(){
 const els=[...document.querySelectorAll('.feeval')];if(!els.length||!W.addr)return;const my=++feeSeq;
 const put=h=>{if(my===feeSeq)document.querySelectorAll('.feeval').forEach(x=>x.innerHTML=h)};
 if(W.chain!==F.chain){put(`<span class="faint">Switch to ${esc(net(F.chain).name)} to estimate</span>`);return}
 try{
  const p=bp(),f=new ethers.ContractFactory(ABI,BUILD.bytecode),e=validate();
  const args=Object.keys(e).length?['Name','SYM',18,10n**27n,W.addr,F.mintable,F.burnable]:deployArgs();
  const tx=await f.getDeployTransaction(...args);
  const [gas,fd]=await Promise.all([p.estimateGas({...tx,from:W.addr}),p.getFeeData()]);
  const price=fd.gasPrice??fd.maxFeePerGas??0n;
  put('≈ '+fmtUnits(gas*price,18,6)+' '+esc(net(F.chain).sym));
 }catch(err){put('<span class="faint">Unavailable</span>')}
}
function deployArgs(){return[F.name.trim(),F.symbol,+F.decimals,ethers.parseUnits(F.supply,+F.decimals),W.addr,F.mintable,F.burnable]}

async function runDeploy(){
 const n=net(F.chain),snap={...F};
 const steps=[['net','Switch wallet to '+n.name],['sign','Confirm the deployment in your wallet'],['mine','Waiting for the network'],['done','Token created']];
 modal('Deploying '+snap.symbol,`<ul class="prog">${steps.map(s=>`<li id="p_${s[0]}"><span class="s"></span><div>${esc(s[1])}<small id="ps_${s[0]}"></small></div></li>`).join('')}</ul><div id="pout"></div>`,null,{dismiss:false});
 const set=(k,st,sub)=>{const li=$('#p_'+k);if(!li)return;li.className=st;if(sub!=null)$('#ps_'+k).innerHTML=sub};
 let cur='net';
 try{
  set('net','run');await ensureChain(snap.chain);set('net','done');renderBar();
  cur='sign';set('sign','run','Check your wallet window');
  const signer=await bp().getSigner();
  const f=new ethers.ContractFactory(ABI,BUILD.bytecode,signer);
  const c=await f.deploy(snap.name.trim(),snap.symbol,+snap.decimals,ethers.parseUnits(snap.supply,+snap.decimals),W.addr,snap.mintable,snap.burnable);
  const tx=c.deploymentTransaction();set('sign','done','');
  cur='mine';set('mine','run',`Transaction <a href="${n.exp}/tx/${tx.hash}" target="_blank" rel="noopener">${short(tx.hash)}</a> submitted`);
  await c.waitForDeployment();const addr=await c.getAddress();
  set('mine','done');set('done','done',`<span class="mono">${addr}</span>`);
  const rec={addr,chain:snap.chain,name:snap.name.trim(),symbol:snap.symbol,decimals:+snap.decimals,supply:snap.supply,mintable:snap.mintable,burnable:snap.burnable,tx:tx.hash,ts:Date.now(),owner:W.addr};
  S.tokens=S.tokens.filter(t=>!(t.addr===addr&&t.chain===snap.chain));S.tokens.unshift(rec);save();
  F.name='';F.symbol='';F.touched={};
  $('#pout').innerHTML=`<div style="display:flex;flex-direction:column;gap:10px">${note('ok','<b>'+esc(rec.symbol)+' is live on '+esc(n.name)+'.</b> The full supply is in your wallet.')}
   <div class="links">${extLink(n.exp+'/token/'+addr,'View on explorer')}<button class="btn sm" id="wa">Add to wallet</button><button class="btn sm" id="cpa">${ICON.copy} Copy address</button></div>
   <div class="links"><a class="btn primary" href="#liquidity" id="gl">Add liquidity</a><a class="btn" href="#tokens" id="gt">Manage token</a></div></div>`;

  $('#gl').onclick=()=>{liqSel=key(rec);closeModal()};$('#gt').onclick=()=>{selected=key(rec);closeModal()};
 }catch(e){

  $('#pout').innerHTML=`<div class="links"><button class="btn" id="cl">Close</button><button class="btn primary" id="rt">Try again</button></div>`;
  $('#cl').onclick=()=>{closeModal();render()};$('#rt').onclick=runDeploy;
 }
}

   ${!W.addr?note('info','Connect your wallet to see live balances and manage this token.'):!on?`${note('info','Your wallet is on '+esc(net(W.chain)?.name||'another network')+'. Switch to '+esc(n.name)+' to manage this token.')}<div><button class="btn primary" id="dsw">Switch to ${esc(n.name)}</button></div>`:`<div class="actions">
    <div class="act"><h3>Transfer</h3><p>Send tokens to another address.</p><input class="inp mono" id="trTo" placeholder="0x… recipient"><div class="line"><input class="inp mono" id="trAmt" placeholder="Amount" inputmode="decimal"><button class="btn" id="trGo">Send</button></div></div>
    ${t.burnable?`<div class="act"><h3>Burn</h3><p>Permanently destroy tokens from your balance.</p><div class="line"><input class="inp mono" id="bAmt" placeholder="Amount" inputmode="decimal"><button class="btn danger" id="bGo">Burn</button></div></div>`:''}
    ${t.mintable?`<div class="act" id="ownBox"><h3>Mint</h3><p>Create new tokens. Only the owner can do this.</p><input class="inp mono" id="mTo" placeholder="0x… recipient" value="${esc(W.addr)}"><div class="line"><input class="inp mono" id="mAmt" placeholder="Amount" inputmode="decimal"><button class="btn" id="mGo">Mint</button></div></div>
    <div class="act"><h3>Ownership</h3><p>Renouncing removes the owner forever, so no one can mint again. This builds buyer trust and cannot be undone.</p><div class="line"><button class="btn danger" id="rGo">Renounce ownership</button></div></div>`:''}
   </div>`}
  </div></div>`;
}
async function loadDetail(t){
 if(!W.addr||W.chain!==t.chain)return;
 try{const c=new ethers.Contract(t.addr,ABI,bp());
  const [sup,bal,own]=await Promise.all([c.totalSupply(),c.balanceOf(W.addr),c.owner()]);
  t.supply=ethers.formatUnits(sup,t.decimals).replace(/\.0$/,'');save();
  $('#kSup')&&($('#kSup').textContent=fmtUnits(sup,t.decimals));$('#kBal')&&($('#kBal').textContent=fmtUnits(bal,t.decimals));
  if($('#kOwn'))$('#kOwn').textContent=own===ethers.ZeroAddress?'None (renounced)':(own===W.addr?'You':short(own));
  if(t.mintable&&own!==W.addr){['mGo','rGo'].forEach(id=>{const b=$('#'+id);if(b){b.disabled=true;b.title='Only the owner can do this'}})}
 }catch(e){toast('Could not read the token: '+errMsg(e),1)}
}
async function txAction(label,fn,t){
 try{toast('Confirm in your wallet');const tx=await fn();toast(label+' submitted');await tx.wait();toast(label+' confirmed');loadDetail(t)}catch(e){toast(errMsg(e),1)}
}
MOUNTS.tokens=()=>{
 document.querySelectorAll('tr[data-k]').forEach(r=>r.onclick=()=>{selected=r.dataset.k;render();$('#det')&&$('#det').scrollIntoView({behavior:'smooth',block:'start'})});
 $('#imp').onclick=importModal;
 const t=S.tokens.find(x=>key(x)===selected);if(!t)return;
 $('#dx').onclick=()=>{selected=null;render()};$('#dcp').onclick=()=>copy(t.addr);$('#dw')&&($('#dw').onclick=()=>watch(t));
 $('#dsw')&&($('#dsw').onclick=async()=>{try{await ensureChain(t.chain);render()}catch(e){toast(errMsg(e),1)}});
 if(!W.addr||W.chain!==t.chain)return;
 const c=async()=>new ethers.Contract(t.addr,ABI,await bp().getSigner());
 const amt=id=>{const v=$('#'+id).value.trim();if(!/^\d+(\.\d+)?$/.test(v)||+v===0){toast('Enter an amount above zero',1);return null}try{return ethers.parseUnits(v,t.decimals)}catch(e){toast('Too many decimal places',1);return null}};
 const to=id=>{const v=$('#'+id).value.trim();if(!ethers.isAddress(v)){toast('That is not a valid address',1);return null}return ethers.getAddress(v)};
 $('#trGo').onclick=()=>{const a=to('trTo'),v=amt('trAmt');if(a&&v!=null)txAction('Transfer',async()=>(await c()).transfer(a,v),t)};
 $('#bGo')&&($('#bGo').onclick=()=>{const v=amt('bAmt');if(v!=null)txAction('Burn',async()=>(await c()).burn(v),t)});
 $('#mGo')&&($('#mGo').onclick=()=>{const a=to('mTo'),v=amt('mAmt');if(a&&v!=null)txAction('Mint',async()=>(await c()).mint(a,v),t)});
 $('#rGo')&&($('#rGo').onclick=()=>modal('Renounce ownership?',`${note('warn','<b>This cannot be undone.</b> No one, including you, will ever be able to mint '+esc(t.symbol)+' again.')}<label class="opt"><input type="checkbox" id="rAck"><div><span>I understand and want to renounce ownership.</span></div></label><button class="btn primary lg" id="rOk" disabled>Renounce in wallet</button>`,()=>{
  $('#rAck').onchange=e=>$('#rOk').disabled=!e.target.checked;
  $('#rOk').onclick=()=>{closeModal();txAction('Renounce',async()=>(await c()).renounceOwnership(),t)};
 }));
 loadDetail(t);
};
function importModal(){
 if(!W.addr){connect();return}
 const n=net(W.chain);
 modal('Import token',`${n?note('info','Reads the contract on <b>'+esc(n.name)+'</b>, the network your wallet is on.'):note('warn','Switch your wallet to a supported network first.')}<div class="field"><label for="iAddr">Token contract address</label><input class="inp mono" id="iAddr" placeholder="0x…"></div><button class="btn primary lg" id="iGo" ${n?'':'disabled'}>Import</button>`,()=>{
  $('#iGo').onclick=async()=>{
   const a=$('#iAddr').value.trim();if(!ethers.isAddress(a))return toast('That is not a valid address',1);
   const addr=ethers.getAddress(a);
   try{const c=new ethers.Contract(addr,ABI,bp());
    const [name,symbol,dec,sup,mintable,burnable]=await Promise.all([c.name(),c.symbol(),c.decimals(),c.totalSupply(),c.mintable(),c.burnable()]);
    const rec={addr,chain:W.chain,name,symbol,decimals:Number(dec),supply:ethers.formatUnits(sup,dec).replace(/\.0$/,''),mintable,burnable,ts:0};
    S.tokens=S.tokens.filter(t=>key(t)!==key(rec));S.tokens.unshift(rec);save();selected=key(rec);closeModal();render();toast(symbol+' imported');
   }catch(e){toast('No OpenHelix token found at that address on '+n.name+'.',1)}
  };
 });
}

/* ---------------- LIQUIDITY ---------------- */
let calc={tok:'',nat:''};
VIEWS.liquidity=()=>{
 const list=S.tokens;
 const t=list.find(x=>key(x)===liqSel)||list[0];if(t)liqSel=key(t);
 const n=t&&net(t.chain);
 let price='—',mcap='—',pct='';
 if(t&&+calc.tok>0&&+calc.nat>0){const p=+calc.nat/+calc.tok;price=p.toPrecision(4)+' '+n.sym;mcap=compact(String(p*Number(t.supply)))+' '+n.sym;pct=(+calc.tok/Number(t.supply)*100).toFixed(2)+'% of supply'}
 return `
 <div class="phead"><div><h1>Liquidity</h1><p>Make your token tradable by pairing it with ${n?esc(n.sym):'the native coin'} on a decentralized exchange, then lock the LP tokens so buyers can see the liquidity can't be pulled.</p></div></div>
 ${!list.length?`<div class="card"><div class="empty"><h3>Create a token first</h3><p>Liquidity setup needs a token you've deployed.</p><div style="margin-top:14px"><a class="btn primary" href="#create">Create a token</a></div></div></div>`:`
 <div class="split">
  <div class="card">
   <div class="card-h"><h2>Launch checklist</h2><select class="inp" id="lSel" style="width:auto;max-width:100%">${list.map(x=>`<option value="${esc(key(x))}" ${key(x)===liqSel?'selected':''}>${esc(x.symbol)} · ${esc(net(x.chain)?.name)}</option>`).join('')}</select></div>
   <div class="steps">
    <div class="step"><span class="n">1</span><div><h3>Create the pool on ${esc(n.dex)}</h3><p>Opens ${esc(n.dex)} with ${esc(t.symbol)} and ${esc(n.sym)} selected. The ratio you deposit sets the starting price. If the token isn't pre-filled, paste the contract address.</p><div class="links">${extLink(n.dexUrl(t.addr),'Open '+n.dex,'btn primary sm')}<button class="btn sm" id="lcp">${ICON.copy} Copy contract</button></div></div></div>
    <div class="step"><span class="n">2</span><div><h3>Lock the LP tokens</h3><p>${esc(n.dex)} gives you LP tokens for your deposit. Lock them with an established locker for at least 90 days. Token scanners check this first.</p><div class="links">${LOCKERS.map(l=>extLink(l[1],l[0])).join('')}</div></div></div>
    <div class="step"><span class="n">3</span><div><h3>${t.mintable?'Renounce ownership':'Verify the source'}</h3><p>${t.mintable?'A token the creator can still mint looks risky to buyers. Renounce once you no longer need to mint.':'Publish the contract source on the explorer so anyone can read it. See Help for the one-time steps.'}</p><div class="links">${t.mintable?`<a class="btn sm" href="#tokens" id="lman">Manage ${esc(t.symbol)}</a>`:`<a class="btn sm" href="#help">Verification steps</a>`}${extLink(n.exp+'/token/'+t.addr,'Explorer')}</div></div></div>
   </div>
  </div>
  <div class="sticky"><div class="card sum"><div class="card-h"><h2>Starting price</h2></div><div class="card-b">
   <div class="field"><label for="cTok">${esc(t.symbol)} to deposit</label><input class="inp mono" id="cTok" inputmode="decimal" placeholder="e.g. 500000000" value="${esc(calc.tok)}"><span class="hint">${pct||'&nbsp;'}</span></div>
   <div class="field"><label for="cNat">${esc(n.sym)} to deposit</label><input class="inp mono" id="cNat" inputmode="decimal" placeholder="e.g. 5" value="${esc(calc.nat)}"></div>
   <dl><dt>Price per token</dt><dd class="mono">${price}</dd><dt>Fully diluted value</dt><dd class="mono">${mcap}</dd></dl>
   ${note('info','OpenHelix doesn\'t hold your funds. Pools and locks are created on third-party platforms under their own terms.')}
  </div></div></div>
 </div>`}`;
};
MOUNTS.liquidity=()=>{
 const s=$('#lSel');if(!s)return;
 s.onchange=()=>{liqSel=s.value;render()};
 const t=S.tokens.find(x=>key(x)===liqSel);
 $('#lcp').onclick=()=>copy(t.addr);$('#lman')&&($('#lman').onclick=()=>{selected=liqSel});
 const bind=(id,k)=>$('#'+id).addEventListener('input',e=>{calc[k]=e.target.value.replace(/[^\d.]/g,'');refreshCreate(id)});
 bind('cTok','tok');bind('cNat','nat');
};

/* ---------------- HELP ---------------- */
VIEWS.help=()=>`
 <div class="phead"><div><h1>Help</h1><p>How OpenHelix works, what it costs, and what you're deploying.</p></div></div>
 <div class="card">
  <details open><summary>What does it cost?</summary><div class="a"><p>OpenHelix charges nothing. You pay the network fee to deploy, which goes to the blockchain. The deploy uses about 800,000 gas. On BNB Chain, Base, Arbitrum, Optimism and Polygon that is usually well under a dollar or a few dollars. On Ethereum mainnet it can be much more, depending on network traffic. The exact fee is shown before you confirm.</p></div></details>
  <details><summary>Does OpenHelix hold my funds or keys?</summary><div class="a"><p>No. Every action is signed in your own wallet. The token supply goes straight to your address, and OpenHelix has no admin rights over your contract.</p></div></details>
  <details><summary>Should I enable minting?</summary><div class="a"><p>Only if you have a specific reason, such as staged emissions. A mintable token has an owner who can create more supply, and most buyers and token scanners flag that as a risk. If you enable it, you can renounce ownership later from My tokens, which disables minting forever.</p></div></details>
  <details><summary>How do I verify the contract on the explorer?</summary><div class="a">
   <p>Verification publishes the source so anyone can read it. Because every OpenHelix token runs identical code, explorers like BscScan and Etherscan often match new tokens automatically once one token on that chain is verified.</p>
   <p>To verify manually: open your token on the explorer, choose <b>Contract → Verify and Publish</b>, and pick <b>Solidity (Standard-JSON-Input)</b> with compiler <span class="mono">v0.8.24</span> and the MIT license. Upload the OpenHelix standard JSON input file. The explorer reads the constructor arguments from the deployment.</p></div></details>
  <details><summary>Is Solana supported?</summary><div class="a"><p>Not yet. Solana tokens use a different standard (SPL) and wallet (Phantom). Solana support is in progress; see the <a href="#roadmap">Roadmap</a>. Today OpenHelix supports BNB Chain, Ethereum, Base, Arbitrum, Optimism, Polygon and Avalanche, plus three testnets.</p></div></details>
  <details><summary>The wallet button says no wallet was found</summary><div class="a"><p>Install a browser wallet such as MetaMask or Rabby and reload. On a phone, open the OpenHelix site in your wallet app's built-in browser. Wallets can't connect to pages shown inside preview frames, so use the hosted site.</p></div></details>
  <details><summary>Is this legal or financial advice?</summary><div class="a"><p>No. Launching a token and raising funds can carry legal and tax obligations that depend on your country. Speak with a qualified lawyer and accountant before involving other people's money.</p></div></details>
  <details><summary>Contract source code</summary><div class="a"><p>Every token is this contract, built on OpenZeppelin Contracts 5.0.2 and compiled with Solidity 0.8.24 (optimizer on, 200 runs, EVM paris).</p><pre>${esc(SOURCE)}</pre></div></details>
 </div>`;

(async()=>{
 render();
 if(typeof ethers==='undefined'){$('#page').innerHTML='<div class="page">'+note('bad','The wallet library failed to load. Check your connection and reload.')+'</div>';return}
 // silently restore a previous connection
 setTimeout(async()=>{

 },300);
